services:
  dash:
    image: ghcr.io/kaenguruudev/uptimekit-dash:5.1.0-api1
    ports:
      - "${DASH_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/uptimekit
      - TIMESERIES_BACKEND=${TIMESERIES_BACKEND:-timescale}
      - APPRISE_URL=http://apprise:8000
      - INTEGRATION_API_KEYS=${INTEGRATION_API_KEYS:-}
    depends_on:
      db:
        condition: service_healthy
      apprise:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'IP=$$(hostname -i | awk ''{print $$1}''); wget -qO- "http://$$IP:3000/api/health" >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: always

  db:
    image: timescale/timescaledb:2.27.1-pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uptimekit
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uptimekit"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: always

  apprise:
    image: caronc/apprise:latest
    environment:
      - APPRISE_WORKER_COUNT=1
    restart: always

volumes:
  db_data:
